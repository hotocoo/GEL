services:
  redis:
    image: redis:8-alpine
    container_name: gel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: gel_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      - ENV=development
      - DB_URL=postgresql+asyncpg://gel:gel_dev@host.docker.internal:5432/gel_dev
      - JWT_SECRET=dev-secret-change-me
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - REDIS_URL=redis://redis:6379/0
